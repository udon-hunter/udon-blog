<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>伊予のうどんハンター備忘録</title>
  <style>
    body { font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; background: #f7f5f0; color: #2b2b2b; margin: 0; line-height: 1.7; }
    .sans { font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; }
    header { background: #1b365d; color: #fff; text-align: center; padding: 2rem 1rem; border-bottom: 4px solid #c59b27; cursor: pointer; }
    .container { max-width: 960px; margin: 0 auto; padding: 1.5rem; }
    .counter-box { background: #fff; border: 2px solid #1b365d; border-radius: 8px; padding: 1.5rem; text-align: center; margin-bottom: 2rem; }
    .counter-number { font-size: 2.8rem; font-weight: bold; color: #d96b27; }
    .section-title { font-size: 1.3rem; color: #1b365d; border-left: 5px solid #c59b27; padding-left: 0.8rem; margin: 2rem 0 1rem; }
    .filter-box, .detail-box { background: #fff; padding: 1.5rem; border-radius: 8px; border: 1px solid #dcd6c8; margin-bottom: 1.5rem; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.5rem; }
    .filter-btn { padding: 0.5rem 1rem; border: 1px solid #1b365d; background: #fff; color: #1b365d; border-radius: 4px; cursor: pointer; }
    .filter-btn.active { background: #1b365d; color: #fff; font-weight: bold; }
    .city-btn { border-color: #d96b27; color: #d96b27; font-size: 0.85rem; }
    .city-btn.active { background: #d96b27; color: #fff; }
    .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; }
    .shop-card { background: #fff; border: 1px solid #dcd6c8; border-radius: 8px; padding: 1.2rem; cursor: pointer; }
    .tag { display: inline-block; font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 3px; font-weight: bold; margin-right: 0.3rem; }
    .tag-region { background: #1b365d; color: #fff; }
    .tag-city { background: #f0ebe1; color: #2b2b2b; }
    .shop-name { font-size: 1.2rem; color: #1b365d; margin: 0.6rem 0; }
    .detail-link { color: #d96b27; font-weight: bold; font-size: 0.9rem; }
    .map-container { width: 100%; height: 350px; border-radius: 8px; overflow: hidden; border: 1px solid #dcd6c8; }
    .back-btn { background: #1b365d; color: #fff; padding: 0.5rem 1.2rem; border-radius: 4px; border: none; cursor: pointer; margin-bottom: 1.5rem; }
    .detail-title { font-size: 1.7rem; color: #1b365d; margin: 0.5rem 0 1.2rem; border-bottom: 2px solid #f0ebe1; padding-bottom: 0.8rem; }
    .photo-box { background: #ebe6dc; border: 1px dashed #b5ad9e; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #6b6457; font-weight: bold; overflow: hidden; }
    .photo-main { width: 100%; height: 320px; margin-bottom: 1rem; }
    .photo-main img, .photo-sub img { width: 100%; height: 100%; object-fit: cover; }
    .menu-highlight { background: #fdf8ee; border-left: 4px solid #c59b27; padding: 0.8rem 1.2rem; margin-bottom: 1.5rem; font-weight: bold; color: #1b365d; }
    .review-text { white-space: pre-wrap; margin-bottom: 2rem; }
    .sub-photos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 2rem; text-align: center; }
    .photo-sub { width: 100%; height: 160px; margin-bottom: 0.3rem; }
    .info-table { width: 100%; border-collapse: collapse; }
    .info-table th, .info-table td { border: 1px solid #dcd6c8; padding: 0.8rem; text-align: left; }
    .info-table th { background: #f7f5f0; color: #1b365d; width: 28%; }
    .map-btn { display: inline-block; margin-top: 1.2rem; background: #d96b27; color: #fff; padding: 0.6rem 1.4rem; border-radius: 4px; text-decoration: none; font-weight: bold; }
    footer { background: #1b365d; color: #fff; text-align: center; padding: 1.5rem; margin-top: 3rem; }
  </style>
  <!-- Google アナリティクス（アクセス解析） -->
  <script async src="https://googletagmanager.com"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XXXXXXXXXX');
  </script>
</head>
<body>
  <header onclick="goHome()">
    <h1>伊予のうどんハンター備忘録</h1>
    <p class="sans">愛媛県内のうどん屋を巡り、味わい、記録する食べ歩き日誌</p>
  </header>
  <!-- 仮公開中の案内バー（本番公開時にこの行を消せばスッキリ消えます） -->
  <div class="sans" style="background-color: #fff3cd; color: #856404; text-align: center; padding: 0.7rem 1rem; font-size: 0.9rem; border-bottom: 1px solid #ffeeba; font-weight: bold;">
    🚧 現在サイト構築中（仮公開版）です。掲載データはサンプルのため、順次実際のレポートへ更新していきます！
  </div>

  <div class="container">
    <div id="home-view">
      <div class="counter-box sans">
        <div style="font-weight: bold; color: #1b365d;">現在のうどん屋 制覇記録</div>
        <div class="counter-number"><span id="shop-count">0</span> <span style="font-size: 1.2rem; color: #2b2b2b;">店舗 達成</span></div>
      </div>

      <h2 class="section-title">エリアから探す</h2>
      <div class="filter-box sans">
        <div style="font-size: 0.9rem; font-weight: bold;">1. 地域を選ぶ</div>
        <div class="btn-group" id="region-buttons">
          <button class="filter-btn active" onclick="selectRegion('all', this)">すべて表示</button>
          <button class="filter-btn" onclick="selectRegion('東予', this)">東予エリア</button>
          <button class="filter-btn" onclick="selectRegion('中予', this)">中予エリア</button>
          <button class="filter-btn" onclick="selectRegion('南予', this)">南予エリア</button>
        </div>
        <div id="city-area" style="display: none; margin-top: 1rem;">
          <div style="font-size: 0.9rem; font-weight: bold;">2. 市町村で絞り込む</div>
          <div class="btn-group" id="city-buttons"></div>
        </div>
      </div>

      <h2 class="section-title">実食レポート一覧（クリックで詳細へ）</h2>
      <div class="shop-grid sans" id="shop-list"></div>

      <h2 class="section-title">愛媛うどんマップ</h2>
      <div class="map-container">
        <iframe src="https://google.com" width="100%" height="100%" style="border:0;" loading="lazy"></iframe>
      </div>
    </div>

    <div id="detail-view" style="display: none;">
      <div class="detail-box sans" id="detail-content"></div>
    </div>
  </div>

  <footer class="sans">&copy; 伊予のうどんハンター備忘録</footer>

  <script>
    var shops = [
      {
        name: "【サンプル1】手打ちうどん まつやま",
        region: "中予",
        city: "松山市",
        date: "2026.11.10",
        menu: "かけうどん（中）・ちくわ天",
        memo: "いりこ出汁の香りがふわっと広がる優しい一杯でした。手打ちならではのほどよい弾力があり、最後まで美味しくいただきました。",
        hours: "11:00〜15:00",
        holiday: "水曜日",
        parking: "あり（5台）",
        address: "愛媛県松山市〇〇町1-2-3",
        mapUrl: "https://google.com",
        imgUdon: "",
        imgShop: "",
        imgMenu: "",
        imgParking: ""
      },
      {
        name: "【サンプル2】今治名物 鍋焼きうどん処",
        region: "東予",
        city: "今治市",
        date: "2026.11.12",
        menu: "鍋焼きうどん・いなり寿司",
        memo: "甘めのお出汁がしっかり染みた、アルミ鍋の鍋焼きうどんです。寒い日にぴったりのホッとする味わいでした。",
        hours: "10:30〜16:00",
        holiday: "木曜日",
        parking: "あり（3台）",
        address: "愛媛県今治市〇〇町4-5-6",
        mapUrl: "https://google.com",
        imgUdon: "",
        imgShop: "",
        imgMenu: "",
        imgParking: ""
      }
    ];

    var cities = {
      "東予": ["今治市", "新居浜市", "西条市", "四国中央市", "上島町"],
      "中予": ["松山市", "伊予市", "東温市", "久万高原町", "松前町", "砥部町"],
      "南予": ["宇和島市", "八幡浜市", "大洲市", "西予市", "内子町", "伊方町", "松野町", "鬼北町", "愛南町"]
    };
    var currentRegion = "all", currentCity = "all";
    document.getElementById("shop-count").innerText = shops.length;

    function showShops() {
      var html = "", count = 0;
      for (var i = 0; i < shops.length; i++) {
        var s = shops[i];
        if ((currentRegion === "all" || s.region === currentRegion) && (currentCity === "all" || s.city === currentCity)) {
          html += '<div class="shop-card" onclick="openDetail(' + i + ')">'
            + '<div><span class="tag tag-region">' + s.region + '</span><span class="tag tag-city">' + s.city + '</span></div>'
            + '<h3 class="shop-name">' + s.name + '</h3>'
            + '<p style="font-size:0.85rem; color:#1b365d; font-weight:bold; margin-bottom:0.4rem;">注文：' + s.menu + '</p>'
            + '<p style="font-size:0.9rem; color:#555;">' + s.memo.substring(0, 40) + '...</p>'
            + '<div style="margin-top:1rem; padding-top:0.8rem; border-top:1px dashed #ccc; display:flex; justify-content:space-between; font-size:0.85rem;">'
            + '<span>訪問日: ' + s.date + '</span><span class="detail-link">レポートを読む →</span></div></div>';
          count++;
        }
      }
      document.getElementById("shop-list").innerHTML = count ? html : '<p style="color:#666;">このエリアの記録はまだありません。</p>';
    }

        function openDetail(i) {
      var s = shops[i];
      var udon = s.imgUdon ? '<img src="' + s.imgUdon + '">' : '【実際のうどんの写真】';
      var shop = s.imgShop ? '<img src="' + s.imgShop + '">' : '【店の雰囲気】';
      var menu = s.imgMenu ? '<img src="' + s.imgMenu + '">' : '【メニュー表】';
      var park = s.imgParking ? '<img src="' + s.imgParking + '">' : '【駐車場の写真】';

      document.getElementById("detail-content").innerHTML =
        '<button class="back-btn" onclick="goHome()">← 一覧に戻る</button>'
        + '<div><span class="tag tag-region">' + s.region + '</span><span class="tag tag-city">' + s.city + '</span> <span style="font-size:0.9rem; color:#666; margin-left:0.5rem;">訪問日: ' + s.date + '</span></div>'
        + '<h2 class="detail-title">' + s.name + '</h2>'
        + '<div class="photo-box photo-main">' + udon + '</div>'
        + '<div class="menu-highlight">注文したメニュー：' + s.menu + '</div>'
        + '<h3 class="section-title">食べた感想</h3><div class="review-text">' + s.memo + '</div>'
        + '<h3 class="section-title">お店の雰囲気・メニュー・駐車場</h3><div class="sub-photos">'
        + '<div><div class="photo-box photo-sub">' + shop + '</div><div style="font-size:0.85rem; color:#666;">店の雰囲気</div></div>'
        + '<div><div class="photo-box photo-sub">' + menu + '</div><div style="font-size:0.85rem; color:#666;">メニュー表</div></div>'
        + '<div><div class="photo-box photo-sub">' + park + '</div><div style="font-size:0.85rem; color:#666;">駐車場の様子</div></div></div>'
        + '<h3 class="section-title">店舗情報</h3><table class="info-table">'
        + '<tr><th>営業時間</th><td>' + s.hours + '</td></tr>'
        + '<tr><th>定休日</th><td>' + s.holiday + '</td></tr>'
        + '<tr><th>駐車場の有無</th><td>' + s.parking + '</td></tr>'
        + '<tr><th>住所</th><td>' + s.address + '</td></tr></table>'
        + '<a href="' + s.mapUrl + '" target="_blank" class="map-btn">Googleマップで場所を開く ↗</a>';

      document.getElementById("home-view").style.display = "none";
      document.getElementById("detail-view").style.display = "block";
      window.scrollTo(0, 0);
      history.pushState({ view: "detail" }, "", "#detail");
    }

    function goHome() {
      if (location.hash === "#detail") {
        history.back();
      } else {
        showHomeView();
      }
    }

    function showHomeView() {
      document.getElementById("detail-view").style.display = "none";
      document.getElementById("home-view").style.display = "block";
      window.scrollTo(0, 0);
    }

    window.addEventListener("popstate", function() {
      showHomeView();
    });


    function goHome() {
      document.getElementById("detail-view").style.display = "none";
      document.getElementById("home-view").style.display = "block";
      window.scrollTo(0, 0);
    }

    function selectRegion(region, btn) {
      var btns = document.querySelectorAll("#region-buttons .filter-btn");
      for (var i = 0; i < btns.length; i++) btns[i].classList.remove("active");
      btn.classList.add("active");
      currentRegion = region; currentCity = "all";
      var area = document.getElementById("city-area"), cBtns = document.getElementById("city-buttons");
      if (region === "all") { area.style.display = "none"; }
      else {
        area.style.display = "block";
        var h = '<button class="filter-btn city-btn active" onclick="selectCity(\'all\', this)">' + region + 'すべて</button>';
        for (var j = 0; j < cities[region].length; j++) {
          h += '<button class="filter-btn city-btn" onclick="selectCity(\'' + cities[region][j] + '\', this)">' + cities[region][j] + '</button>';
        }
        cBtns.innerHTML = h;
      }
      showShops();
    }

    function selectCity(city, btn) {
      var btns = document.querySelectorAll(".city-btn");
      for (var i = 0; i < btns.length; i++) btns[i].classList.remove("active");
      btn.classList.add("active");
      currentCity = city;
      showShops();
    }
    showShops();
  </script>
</body>
</html>
